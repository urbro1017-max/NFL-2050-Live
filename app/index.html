const modules=["Game Center","Teams","Players","Season","Data"];
const C=(cl,h,sub,b)=>`<section class="card ${cl}"><div class="h">${h}</div>${sub?`<div class="subh">${sub}</div>`:""}${b}</section>`;
const metric=(a,b="—")=>`<div class="metric"><span>${a}</span><b>${b}</b></div>`;
function gamePage(){return `<div class="grid">${C("c8","Game Flow","LIVE SCORE, TEAM OUTPUT & RECENT ACTION",`<div class="bigstat"><div class="kpi"><small>DET SCORE</small><b id="gDet">0</b></div><div class="kpi"><small>BUF SCORE</small><b id="gBuf">0</b></div><div class="kpi"><small>PERIOD</small><b id="gPeriod">—</b></div><div class="kpi"><small>CLOCK</small><b id="gClock">—</b></div></div><div id="recentPlays" class="plays" style="margin-top:12px">${metric("Waiting for live play-by-play…","")}</div>`) }${C("","Team Comparison","LIVE GAME STATISTICS",`<div id="teamCompare">${compareRow("Total Yards","—","—")}${compareRow("Passing","—","—")}${compareRow("Rushing","—","—")}${compareRow("First Downs","—","—")}${compareRow("Turnovers","—","—")}</div>`) }${C("c12","Game Intelligence","ONE CLEAN VIEW — NO DUPLICATED DASHBOARDS",`<div class="notice">This page is only for the current game: score, clock, team comparison and play flow. Player production lives under Players; season context lives under Season.</div>`)}</div>`}
function compareRow(l,d,b){return `<div class="label">${l}</div><div class="compare"><strong>${d}</strong><div class="bar"><i class="d" style="width:50%"></i><i class="b" style="width:50%"></i></div><strong>${b}</strong></div>`}
function teamPage(){return `<div class="grid">${C("c6","Detroit Lions","TEAM IDENTITY & CURRENT GAME PROFILE",`<div style="display:flex;align-items:center;gap:16px"><img class="logo" src="https://a.espncdn.com/i/teamlogos/nfl/500/det.png"><div><div class="name" style="font-size:27px">DETROIT</div><div class="notice">Offense, defense and situational team information without repeating the Game Center.</div></div></div><div id="detTeamStats" style="margin-top:10px"></div>`) }${C("c6","Buffalo Bills","TEAM IDENTITY & CURRENT GAME PROFILE",`<div style="display:flex;align-items:center;gap:16px"><img class="logo" src="https://a.espncdn.com/i/teamlogos/nfl/500/buf.png"><div><div class="name" style="font-size:27px">BUFFALO</div><div class="notice">Offense, defense and situational team information without repeating the Game Center.</div></div></div><div id="bufTeamStats" style="margin-top:10px"></div>`)}</div>`}
function rosterTiles(f="ALL"){let q=R.filter(x=>f==="ALL"||x.t===f||x.p===f||(f==="SKILL"&&/QB|RB|WR|TE/.test(x.p))||(f==="DEF"&&/CB|DB|S|LB|ILB|OLB|DL|EDGE/.test(x.p)));return `<div class="roster">${q.map(x=>`<div class="player" style="--tc:${x.t==="DET"?"var(--det)":"var(--buf)"}" onclick="openP('${x.t}',${JSON.stringify(x.n)})"><div class="num">#${x.num}</div><div class="pn">${x.n}</div><div class="pm">${x.t} • ${x.p} • ${x.college}</div></div>`).join("")}</div>`}
function playersPage(){return `<div class="grid">${C("c12","Players","ROSTER DIRECTORY & PLAYER PROFILES",`<div class="tabs"><button onclick="rf('ALL')">ALL</button><button onclick="rf('DET')">DET</button><button onclick="rf('BUF')">BUF</button><button onclick="rf('QB')">QB</button><button onclick="rf('SKILL')">SKILL</button><button onclick="rf('DEF')">DEFENSE</button></div><div id="rgrid">${rosterTiles()}</div>`)}</div>`}
function seasonPage(){let rows=["Total Offense","Scoring Offense","Passing Offense","Rushing Offense","Total Defense","Scoring Defense","Passing Defense","Rushing Defense"];return `<div class="grid">${C("c12","Season Rankings","2026 LEAGUE CONTEXT",`<div class="rankgrid" id="rankgrid">${rows.map(x=>`<div class="rank"><span>${x}</span><span class="det">DET —</span><span class="buf">BUF —</span></div>`).join("")}</div><div class="notice" style="margin-top:12px">Rankings appear only when the season-stat endpoint returns a verified league rank. Missing fields stay blank instead of being estimated.</div>`) }${C("c6","Detroit Season Lens","SEASON-LEVEL CONTEXT",metric("Record","—")+metric("Point differential","—")+metric("Conference rank","—")+metric("Division rank","—"))}${C("c6","Buffalo Season Lens","SEASON-LEVEL CONTEXT",metric("Record","—")+metric("Point differential","—")+metric("Conference rank","—")+metric("Division rank","—"))}</div>`}
function dataPage(){return `<div class="grid">${C("c6","Live Engine","CONNECTION HEALTH",metric("Game feed",'<span id="feedStatus">Connecting</span>')+metric("Refresh cadence","3 seconds")+metric("Event ID","401872932")+metric("Last update",'<span id="lastUpdate">—</span>'))}${C("c6","Data Integrity","WHAT THE APP WILL AND WILL NOT DO",`<div class="notice">Gridiron Nexus displays verified values from its connected feeds. It does not invent missing player stats, rankings, charting data, or advanced metrics. This keeps the dashboard useful for real analysis instead of filling gaps with fake numbers.</div>`)}</div>`}
function page(n){return n==="Game Center"?gamePage():n==="Teams"?teamPage():n==="Players"?playersPage():n==="Season"?seasonPage():dataPage()}
const nav=document.getElementById("nav"),pages=document.getElementById("pages");modules.forEach((n,i)=>{let b=document.createElement("button");b.textContent=n;b.dataset.n=n;if(!i)b.className="on";nav.appendChild(b);let s=document.createElement("section");s.className="page"+(!i?" on":"");s.dataset.n=n;s.innerHTML=page(n);pages.appendChild(s)});nav.onclick=e=>{if(e.target.tagName!=="BUTTON")return;document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));e.target.classList.add("on");document.querySelectorAll(".page").forEach(x=>x.classList.toggle("on",x.dataset.n===e.target.dataset.n))}
function rf(f){document.getElementById("rgrid").innerHTML=rosterTiles(f)}
function openP(t,n){let x=R.find(p=>p.t===t&&p.n===n);if(!x)return;document.getElementById("profile").innerHTML=`<div style="display:flex;gap:18px;align-items:center"><img class="logo" src="https://a.espncdn.com/i/teamlogos/nfl/500/${t.toLowerCase()}.png"><div><div class="city">${t==="DET"?"DETROIT LIONS":"BUFFALO BILLS"}</div><div class="name">${x.n}</div><div class="notice">#${x.num} • ${x.p} • ${x.ht} • ${x.wt} LB • Age ${x.age} • Exp ${x.exp} • ${x.college}</div></div></div><div class="grid" style="margin-top:16px">${C("c6","Game Production","LIVE PLAYER VALUES WHEN VERIFIED",metric("Passing","—")+metric("Rushing","—")+metric("Receiving","—")+metric("Touchdowns","—"))}${C("c6","Profile","ROSTER INFORMATION",metric("Position",x.p)+metric("Number",x.num)+metric("Experience",x.exp)+metric("College",x.college))}</div>`;document.getElementById("modal").classList.add("on")}
function closeP(){document.getElementById("modal").classList.remove("on")}document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeP()}
function findStat(arr,names){if(!arr)return "—";let s=arr.find(x=>names.some(n=>(x.name||x.label||"").toLowerCase().includes(n)));return s?.displayValue??s?.value??"—"}
function statList(arr){if(!arr||!arr.length)return metric("Waiting for live team statistics…","");return arr.slice(0,10).map(s=>metric(s.label||s.name,s.displayValue??s.value??"—")).join("")}
async function poll(){try{let r=await fetch('/api/live',{cache:'no-store'});if(!r.ok)throw Error();let d=await r.json(),g=d.game||{},D=d.teamStats?.DET||[],B=d.teamStats?.BUF||[];let set=(id,v)=>{let e=document.getElementById(id);if(e)e.textContent=v??"—"};set('detScore',g.detScore??0);set('bufScore',g.bufScore??0);set('gameStatus',g.status||'Pregame');set('period',g.period?`Q${g.period}`:'—');set('clock',g.clock||'—');set('gDet',g.detScore??0);set('gBuf',g.bufScore??0);set('gPeriod',g.period?`Q${g.period}`:'—');set('gClock',g.clock||'—');set('lastUpdate',new Date().toLocaleTimeString());set('feedStatus','Connected');let tc=document.getElementById('teamCompare');if(tc)tc.innerHTML=compareRow('Total Yards',findStat(D,['total yards','totalyards']),findStat(B,['total yards','totalyards']))+compareRow('Passing',findStat(D,['passing yards','net passing']),findStat(B,['passing yards','net passing']))+compareRow('Rushing',findStat(D,['rushing yards']),findStat(B,['rushing yards']))+compareRow('First Downs',findStat(D,['first downs','firstdowns']),findStat(B,['first downs','firstdowns']))+compareRow('Turnovers',findStat(D,['turnovers']),findStat(B,['turnovers']));let a=document.getElementById('detTeamStats');if(a)a.innerHTML=statList(D);let b=document.getElementById('bufTeamStats');if(b)b.innerHTML=statList(B);let p=document.getElementById('recentPlays');if(p){let q=(d.plays||[]).slice(-8).reverse();p.innerHTML=q.length?q.map(x=>metric(x.text||'Play',x.clock||'')).join(''):metric('No plays available yet.','')}}catch(e){let s=document.getElementById('feedStatus');if(s)s.textContent='Retrying'}}poll();setInterval(poll,3000);
</script></body></html>
