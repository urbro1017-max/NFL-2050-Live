const modules=["Command Center","Detroit Hub","Buffalo Hub","Roster","GM View","Game","Quarterbacks","Skill Players","Defense","Trenches","Situations","Drives","Analytics","Projections","Data Status","Postgame"];
const C=(cl,t,b)=>`<section class="card ${cl}"><div class="h">${t}</div>${b}</section>`;
const K=a=>`<div class="kpis">${a.map(x=>{let id={"SCORE / STATE":"liveState","DET":"liveDetScore","BUF":"liveBufScore","SCORE":"liveState"}[x]||"";return `<div class="kpi"><span class="label">${x}</span><b ${id?`id="${id}"`:""}>—</b><span class="pill">LIVE</span></div>`}).join("")}</div>`;
const M=a=>a.map(x=>`<div class="metric"><span>${x}</span><b>—</b></div>`).join("");
function tiles(team,list=R.filter(x=>x.t===team)){return `<div class="roster">${list.map(x=>`<div class="player" style="--tc:${team==="DET"?"var(--det)":"var(--bufr)"}" onclick="openP('${x.t}',${JSON.stringify(x.n)})"><div class="no">#${x.num}</div><div class="pn">${x.n}</div><div class="meta">${x.p} • ${x.ht} • ${x.wt}</div></div>`).join("")}</div>`}
function hub(team){let name=team==="DET"?"DETROIT LIONS":"BUFFALO BILLS",cl=team==="DET"?"det":"buf",tc=team==="DET"?"var(--det)":"var(--bufr)";return `<div class="grid">${C("c12 "+cl,"TEAM HUB",`<div class="teamHeader" style="--tc:${tc}"><div class="teamMark">${team}</div><div><div class="label">ACTIVE TEAM INTELLIGENCE</div><div class="teamName">${name}</div><div class="statusRow"><span class="fresh">● VERIFIED ROSTER SNAPSHOT</span><span class="pill">${R.filter(x=>x.t===team).length} ACTIVE</span></div></div></div>`)}${C("c12 "+cl,"TEAM TELEMETRY",K(["TOTAL OFFENSE","YARDS / PLAY","3RD DOWN","RED ZONE","TURNOVERS","PTS / DRIVE"]))}${C("c4 "+cl,"OFFENSE",M(["Pass yards","Rush yards","Explosives","Sacks allowed","Run rate","Pass rate"]))}${C("c4 "+cl,"DEFENSE",M(["Tackles","TFL","Sacks","QB hits","Takeaways","Explosives allowed"]))}${C("c4 "+cl,"SITUATIONAL",M(["3rd down","4th down","Red zone","Goal to go","2 minute","Points / drive"]))}${C("c12 "+cl,"ACTIVE ROSTER",tiles(team))}</div>`}
function rosterPage(){return `<div class="grid">${C("c12 cyan","ACTIVE ROSTER DIRECTORY",`<div class="filters"><button onclick="rf('ALL')">ALL</button><button onclick="rf('DET')">DET</button><button onclick="rf('BUF')">BUF</button><button onclick="rf('QB')">QB</button><button onclick="rf('RB')">RB</button><button onclick="rf('WR')">WR</button><button onclick="rf('TE')">TE</button><button onclick="rf('OL')">OL</button><button onclick="rf('DEF')">DEF</button></div><div id="rgrid">${renderR("ALL")}</div>`)}</div>`}
function renderR(f){let q=R.filter(x=>f==="ALL"||x.t===f||x.p===f||(f==="OL"&&/OL|T|G|C/.test(x.p))||(f==="DEF"&&/CB|DB|S|LB|ILB|OLB|DL|EDGE/.test(x.p)));return `<div class="roster">${q.map(x=>`<div class="player" style="--tc:${x.t==="DET"?"var(--det)":"var(--bufr)"}" onclick="openP('${x.t}',${JSON.stringify(x.n)})"><div class="no">#${x.num}</div><div class="pn">${x.n}</div><div class="meta">${x.t} • ${x.p} • ${x.college}</div></div>`).join("")}</div>`}function rf(f){document.getElementById("rgrid").innerHTML=renderR(f)}
function generic(n){let defs={ "Command Center":["GAME STATE","DET CONTROL","BUF CONTROL","EXECUTIVE SIGNAL"],"GM View":["EXECUTIVE HUD","DET SIGNAL","BUF SIGNAL","DECISION SUPPORT"],"Game":["LIVE GAME","DET OFFENSE","BUF OFFENSE","GAME FLOW"],"Quarterbacks":["QB COMPARISON","DET QB","BUF QB","PASSING PROFILE"],"Skill Players":["TOUCH / TARGET LAB","DET SKILL","BUF SKILL","OPPORTUNITY"],"Defense":["DEFENSIVE COMMAND","DET DEFENSE","BUF DEFENSE","IMPACT"],"Trenches":["TRENCH CONTROL","DET TRENCHES","BUF TRENCHES","PRESSURE"],"Situations":["SITUATIONAL CONTROL","DET SITUATIONS","BUF SITUATIONS","CRITICAL DOWNS"],"Drives":["DRIVE CONTROL","DET DRIVES","BUF DRIVES","FIELD POSITION"],"Analytics":["EFFICIENCY ENGINE","DET VECTOR","BUF VECTOR","ADVANCED FIELDS"],"Projections":["PROJECTION CONTROL","DET PACE","BUF PACE","TRACKING"],"Data Status":["DATA PIPELINE","ROSTER LAYER","LIVE STAT LAYER","INTEGRITY"],"Postgame":["FINAL REPORT","DET SUMMARY","BUF SUMMARY","EXECUTIVE REVIEW"]}[n]||["GAME STATE","DET","BUF","SIGNAL"];return `<div class="grid">${C("c12 cyan",defs[0],K(["SCORE / STATE","EFFICIENCY","EXPLOSIVES","TURNOVERS","TRENCHES","CONTROL"]))}${C("c6 det",defs[1],M(["Total offense","Yards / play","3rd down","Red zone","Sacks","Takeaways"]))}${C("c6 buf",defs[2],M(["Total offense","Yards / play","3rd down","Red zone","Sacks","Takeaways"]))}${C("c12 violet",defs[3],`<div style="font-size:10px;color:#91adbb;line-height:1.6">Verified data populates this surface when connected. Fields without a verified source remain unavailable rather than being estimated.</div>`)}</div>`}
function liveCommand(){
return `<div class="grid">
${C("c12 cyan","LIVE GAME STATE",`<div class="kpis">
<div class="kpi"><span class="label">DET</span><b id="detScore">0</b><span class="pill" id="detStatus">CONNECTED</span></div>
<div class="kpi"><span class="label">BUF</span><b id="bufScore">0</b><span class="pill" id="bufStatus">CONNECTED</span></div>
<div class="kpi"><span class="label">PERIOD</span><b id="period">—</b></div>
<div class="kpi"><span class="label">CLOCK</span><b id="clock">—</b></div>

</div>`)}
${C("c6 det","DETROIT LIVE TEAM STATS",`<div id="detLiveStats">${M(["Total yards","Passing","Rushing","1st downs","Turnovers","Possession"])}</div>`)}

${C("c12 violet","RECENT PLAYS",`<div id="recentPlays"><div style="font-size:10px;color:#91adbb">Waiting for live play-by-play…</div></div>`)}
</div>`}
function page(n){if(n==="Command Center")return liveCommand();if(n==="Detroit Hub")return hub("DET");if(n==="Buffalo Hub")return hub("BUF");if(n==="Roster")return rosterPage();return generic(n)}
const nav=document.getElementById("nav"),pages=document.getElementById("pages");modules.forEach((n,i)=>{let b=document.createElement("button");b.textContent=n;b.dataset.n=n;if(!i)b.className="on";nav.appendChild(b);let s=document.createElement("section");s.className="page"+(!i?" on":"");s.dataset.n=n;s.innerHTML=page(n);pages.appendChild(s)});nav.onclick=e=>{if(e.target.tagName!=="BUTTON")return;document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));e.target.classList.add("on");document.querySelectorAll(".page").forEach(x=>x.classList.toggle("on",x.dataset.n===e.target.dataset.n));document.getElementById("ttl").textContent=e.target.dataset.n.toUpperCase();document.querySelector("main").scrollTop=0}
function openP(t,n){let x=R.find(p=>p.t===t&&p.n===n);if(!x)return;let tc=t==="DET"?"var(--det)":"var(--bufr)";document.getElementById("box").style.setProperty("--tc",tc);document.getElementById("profile").innerHTML=`<div class="profileTop"><div class="avatar">#${x.num}</div><div><div class="label">${t==="DET"?"DETROIT LIONS":"BUFFALO BILLS"} • ACTIVE ROSTER</div><div class="pname">${x.n}</div><div style="font-size:10px;color:#9db7c5">${x.p} • ${x.ht} • ${x.wt} LB • AGE ${x.age} • EXP ${x.exp} • ${x.college}</div><div class="stats">${["TOTAL YDS","TD","TOUCHES","TARGETS","TACKLES","SACKS","TAKEAWAYS","SNAPS*"].map(y=>`<div class="stat"><span class="label">${y}</span><b>—</b></div>`).join("")}</div></div></div><div class="grid" style="margin-top:14px">${C("c6 "+(t==="DET"?"det":"buf"),"LIVE PRODUCTION",M(["Pass yards","Rush yards","Rec yards","Total yards","TD","Turnovers"]))}${C("c6 violet","ROLE / USAGE",M(["Rush attempts","Targets","Receptions","Touches","Snap share*","Routes*"]))}${C("c12 green","DATA STATUS",`<div style="font-size:10px;color:#91adbb">Roster identity is from the verified active-roster snapshot. Live statistical values require the secure data bridge. * requires snap or charted/play-by-play data.</div>`)}</div>`;document.getElementById("modal").classList.add("on")}function closeP(){document.getElementById("modal").classList.remove("on")}document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeP()}

const LIVE_URL="/api/live";
let lastPayload=null;
function val(o,...keys){for(const k of keys){if(o && o[k]!==undefined && o[k]!==null)return o[k]}return "—"}
function statRows(stats){
 if(!stats||!stats.length)return `<div style="font-size:10px;color:#91adbb">Waiting for game statistics…</div>`;
 return stats.slice(0,12).map(s=>`<div class="metric"><span>${s.label||s.name||"Stat"}</span><b>${s.displayValue??s.value??"—"}</b></div>`).join("");
}
function applyLive(d){
 lastPayload=d;
 const g=d.game||{};
 const set=(id,v)=>{let e=document.getElementById(id);if(e)e.textContent=v??"—"};
 set("detScore",g.detScore??"0"); set("bufScore",g.bufScore??"0");
 set("period",g.period||"—"); set("clock",g.clock||"—"); set("gameStatus",g.status||"—");
 set("lastUpdate",new Date().toLocaleTimeString());
 let ds=document.getElementById("detLiveStats"); if(ds)ds.innerHTML=statRows(d.teamStats?.DET);
 let bs=document.getElementById("bufLiveStats"); if(bs)bs.innerHTML=statRows(d.teamStats?.BUF);
 let rp=document.getElementById("recentPlays");
 if(rp){
   const plays=(d.plays||[]).slice(-8).reverse();
   rp.innerHTML=plays.length?plays.map(p=>`<div class="metric"><span>${p.text||"Play"}</span><b>${p.clock||""}</b></div>`).join(""):`<div style="font-size:10px;color:#91adbb">No plays available yet.</div>`;
 }
}
async function pollLive(){
 try{
   const r=await fetch(LIVE_URL,{cache:"no-store"});
   if(!r.ok)throw new Error("HTTP "+r.status);
   applyLive(await r.json());
 }catch(e){
   let s=document.getElementById("gameStatus"); if(s)s.textContent="DATA LINK RETRYING";
 }
}
pollLive(); setInterval(pollLive,3000);
